name: Deploy to AWS
on:
  push:
    branches:
      - main  # Change to your deployment branch
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v2
    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: 3.10.14
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install boto3
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-1  
    - name: Sync S3 bucket
      run: |
        aws s3 sync ./src/lambda-function s3://dexcom-api-app --delete
    - name: Invalidate CloudFront cache
      run: |
        aws cloudfront create-invalidation --distribution-id E1J03GUBWX9Y8C --paths "/*"
    - name: Deploy Lambda function
      run: |
        cd ./src/lambda-function
        zip -r lambda-function.zip lambda-function -x ".git/*" ".github/*" 
        aws lambda update-function-code --function-name dexcom-api --zip-file fileb://lambda-function.zip